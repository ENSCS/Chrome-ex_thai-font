<!doctype html>
<meta charset="utf-8">
<style>
  @font-face{font-family:"TRF Sarabun";font-weight:400;src:url(fonts/Sarabun-Regular.ttf)}
  @font-face{font-family:"TRF Sarabun";font-weight:700;src:url(fonts/Sarabun-Bold.ttf)}
  :root{--ff:system-ui,"Thonburi","TRF Sarabun",sans-serif}
  :root{--accent:#3b6fd8;--accent-soft:#e8effc;--fg:#161616;--sub:#8a8a8a;--line:#e6e6e6;--card:#fff;--bg:#f6f6f6}
  *{box-sizing:border-box}
  body{margin:0;width:300px;background:var(--bg);color:var(--fg);font:14px/1.3 var(--ff)}
  .top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
  .top img{width:32px;height:32px;border-radius:8px}
  .title{flex:1;font-size:15px;font-weight:700}
  .switch{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:#d5d5d8;cursor:pointer;padding:0;transition:.15s;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
  .switch.on{background:var(--accent)}
  .switch.on::after{left:21px}
  .body{padding:12px 14px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  button{font-family:var(--ff)}
  .cap{display:flex;justify-content:space-between;padding:12px 14px 0;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--sub)}
  .big{display:flex;align-items:center;justify-content:space-between;padding:14px}
  .big button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:var(--fg);cursor:pointer}
  .big button:hover{background:var(--bg)}
  #pct{font-size:34px;font-weight:700;letter-spacing:-.02em}
  .chips{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
  .chips button{flex:1;height:30px;padding:0 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:500 13px var(--ff);color:var(--fg);cursor:pointer}
  .lbl{padding:8px 14px 0;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}
  .mins{border-top:0;padding-top:6px}
  .fonts{border-top:0;border-bottom:1px solid var(--line)}
  .chips button:hover{background:#ececec}
  .chips button.sel{background:var(--accent-soft);border-color:#b9cdf5;color:var(--accent)}
  .lite{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:0 2px}
  .lite small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
  .lite .switch{width:38px;height:24px;border-radius:12px}
  .lite .switch::after{width:18px;height:18px}
  .lite .switch.on::after{left:17px}
  .dim{opacity:.4;pointer-events:none}
</style>
<div class="top">
  <img src="icons/icon48.png" alt="">
  <span class="title">ฟอนต์ไทยอ่านง่าย</span>
  <button class="switch" id="sw" role="switch" aria-label="เปิด/ปิดเฉพาะแท็บนี้" title="เปิด/ปิดเฉพาะแท็บนี้"></button>
</div>
<div class="body" id="ctl">
  <div class="card">
    <div class="chips fonts" id="fonts"><button data-f="mac">macOS</button><button data-f="sarabun">Sarabun</button><button data-f="google">Google</button></div>
    <div class="big"><button id="minus">A−</button><span id="pct">20px</span><button id="plus">A+</button></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="lite" id="liteRow" hidden>
    <div>ปรับเฉพาะฟอนต์<small id="host"></small></div>
    <button class="switch" id="liteSw" role="switch" aria-label="ปรับเฉพาะฟอนต์บนเว็บนี้"></button>
  </div>
</div>
<script src="popup.js"></script>
